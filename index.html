<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de gastos personales</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Control de gastos personales</h1>
    <p id="presupuesto" class="presupuesto"></p>

    <section class="tarjeta">
      <h2>Registrar gasto</h2>
      <form id="formulario" novalidate>
        <div class="campo">
          <label for="descripcion">Descripción del gasto</label>
          <input type="text" id="descripcion" name="descripcion" placeholder="Ej: Almuerzo">
          <p class="error" id="error-descripcion"></p>
        </div>

        <div class="campo">
          <label for="valor">Valor (COP)</label>
          <input type="number" id="valor" name="valor" placeholder="Ej: 12000">
          <p class="error" id="error-valor"></p>
        </div>

        <div class="campo">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="">Selecciona una categoría</option>
            <option value="Comida">Comida</option>
            <option value="Transporte">Transporte</option>
            <option value="Estudio">Estudio</option>
            <option value="Otros">Otros</option>
          </select>
          <p class="error" id="error-categoria"></p>
        </div>

        <button type="submit" class="boton-principal">Agregar gasto</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Mis gastos</h2>

      <div class="campo">
        <label for="filtro">Filtrar por categoría</label>
        <select id="filtro">
          <option value="todas">Todas</option>
          <option value="Comida">Comida</option>
          <option value="Transporte">Transporte</option>
          <option value="Estudio">Estudio</option>
          <option value="Otros">Otros</option>
        </select>
      </div>

      <table id="tabla-gastos">
        <thead>
          <tr>
            <th>Descripción</th>
            <th>Categoría</th>
            <th>Valor</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>

      <p id="mensaje-vacio" class="vacio">No hay gastos para mostrar.</p>

      <p id="total" class="total">Total gastado: <span id="total-valor">$ 0</span></p>
    </section>
  </main>
</body>
</html>
